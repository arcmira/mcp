name: Plugin or skill feedback
description: Help improve Arcmira's setup, skills, and research answers.
title: "[Plugin feedback] "
body:
  - type: markdown
    attributes:
      value: |
        This issue will be public. Use a public or redacted example. Do not include API keys, tokens, account details, private prompts, or full transcripts. Private support: https://arcmira.com/contact
  - type: input
    id: host
    attributes:
      label: Host and version
      placeholder: Claude Code, Cowork, ChatGPT, Codex, Cursor, or another host
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version and installation method
      description: Include the installed plugin version if available. The describe tool reports the remote server version, which can differ.
      placeholder: "Plugin 0.8.0, installed through a marketplace"
    validations:
      required: true
  - type: input
    id: skill
    attributes:
      label: Skill or task
      placeholder: "find-quotes, sponsor-research, setup, or the task you were doing"
  - type: textarea
    id: example
    attributes:
      label: Public or redacted example
      description: Give the shortest example that reproduces the issue. Include a public video URL or timestamp if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include a redacted error code if available. For answer quality, explain the incorrect attribution, missed result, or missing context.
    validations:
      required: true
